services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: backends-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-8f78b51c031c426fa58b47f875fec202}
      POSTGRES_USER: ${POSTGRES_USER:-af56f868db2a46029d4d210a342ac046}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f5216f5d-1435-4487-898b-f0b1edd70c02}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-af56f868db2a46029d4d210a342ac046} -d ${POSTGRES_DB:-8f78b51c031c426fa58b47f875fec202}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: backends-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    networks:
      - backend-net

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine
    container_name: backends-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  backend-net:
    name: backend-net